name: Release

# Builds the desktop installers and the Android APK, then publishes them as
# assets on a GitHub Release. Trigger by pushing a tag like `v1.0.0`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            args: --target x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          VITE_DEFAULT_TMDB_KEY: ${{ secrets.VITE_DEFAULT_TMDB_KEY }}

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Recurse src-tauri/target/**/release/bundle -Include *.msi,*-setup.exe |
            Copy-Item -Destination artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build
        env:
          VITE_DEFAULT_TMDB_KEY: ${{ secrets.VITE_DEFAULT_TMDB_KEY }}

      - name: Capacitor sync
        run: npx cap sync android

      - name: Gradle build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign or rename APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p artifacts
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
            "$BT/apksigner" sign --ks release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "artifacts/zetsu-android.apk" "$APK"
            rm -f release.keystore
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — publishing an UNSIGNED APK."
            cp "$APK" artifacts/zetsu-android-unsigned.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
