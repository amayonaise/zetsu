[package]
name = "zetsu"
version = "1.1.0"
description = "Zetsu — Premium Desktop Streaming Platform for Movies, TV Shows, and Live Sports"
authors = ["Zetsu Core Contributors"]
edition = "2021"

[lib]
name = "zetsu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
